workflows:
  lumi-ios-build:
    name: Lumi Camera iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: app.lumicamera.ios
      xcode: latest
    scripts:
      - name: Check repository structure
        script: |
          set -e
          echo "Repository root: $(pwd)"
          test -f project.yml
          test -f LumiCameraApp.swift
          test -f CameraProfileTests.swift
          echo "Project files found."
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          set -e
          xcodegen generate --spec project.yml
          test -d LumiCamera.xcodeproj
      - name: Build for iOS device
        script: |
          set -e
          xcodebuild -project LumiCamera.xcodeproj \
            -scheme LumiCamera \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/LumiCamera.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $CM_BUILD_DIR/LumiCamera.xcarchive
      - $CM_BUILD_DIR/**/*.log
