name: LumiCamera
options:
  bundleIdPrefix: app.lumicamera
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: app.lumicamera.ios
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LumiCamera:
    type: application
    platform: iOS
    sources:
      - CameraService.swift
      - CameraView.swift
      - GalleryView.swift
      - HomeView.swift
      - LumiCameraApp.swift
      - Models.swift
      - PhotoStore.swift
      - ProcessingPipeline.swift
      - ProfileLibrary.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lumi Camera
        NSCameraUsageDescription: "O Lumi Camera usa a camera para capturar fotos."
        NSPhotoLibraryAddUsageDescription: "O Lumi Camera salva as fotos que voce escolher."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  LumiCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CameraProfileTests.swift
    dependencies:
      - target: LumiCamera
