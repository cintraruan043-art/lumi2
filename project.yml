name: LumiCamera
options:
  bundleIdPrefix: app.lumicamera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: app.lumicamera.ios
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LumiCamera:
    type: application
    platform: iOS
    sources:
      - path: CameraService.swift
      - path: CameraView.swift
      - path: GalleryView.swift
      - path: HomeView.swift
      - path: LumiCameraApp.swift
      - path: Models.swift
      - path: PhotoStore.swift
      - path: ProcessingPipeline.swift
      - path: ProfileLibrary.swift
    info:
      properties:
        CFBundleDisplayName: Lumi Camera
        NSCameraUsageDescription: "O Lumi Camera usa a câmera para capturar fotos."
        NSPhotoLibraryAddUsageDescription: "O Lumi Camera salva as fotos que você escolher."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_EMIT_LOC_STRINGS: YES
  LumiCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CameraProfileTests.swift
    dependencies:
      - target: LumiCamera
